<div style="height:100%;padding:18px;display:flex;flex-direction:column;gap:12px;overflow:hidden">
  <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap">
    <div>
      <p style="margin:0;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#0f766e">Returns</p>
      <h2 style="margin:4px 0 0;font-size:24px;font-weight:800;color:#18181b">Invoice Returns</h2>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <button id="returnsReloadButton" type="button" class="epos-btn epos-btn-primary">Load Returns</button>
      <button id="returnsResetButton" type="button" class="epos-btn epos-btn-outline">Reset</button>
    </div>
  </div>

  <p id="returnsMessage" class="hidden" style="margin:0;border-radius:6px;padding:8px 12px;font-size:13px;font-weight:700"></p>

  <section style="border:1px solid #e5e7eb;background:#fff;border-radius:8px;padding:12px;display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:10px;align-items:end">
    <label style="display:flex;flex-direction:column;gap:5px">
      <span style="font-size:12px;font-weight:700;color:#52525b">Invoice number</span>
      <input id="returnInvoiceSearch" type="search" placeholder="POS-..."
        style="height:38px;border:1px solid #d4d4d8;border-radius:6px;padding:0 10px;font-size:13px" />
    </label>
    <button id="lookupReturnButton" type="button" class="epos-btn epos-btn-primary">Lookup Invoice</button>
  </section>

  <section style="min-height:0;flex:1;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,.65fr);gap:12px;overflow:hidden">
    <div style="min-height:0;border:1px solid #e5e7eb;background:#fff;border-radius:8px;display:flex;flex-direction:column;overflow:hidden">
      <div id="returnInvoicePanel" style="padding:12px;border-bottom:1px solid #e5e7eb;background:#f8fafc;color:#71717a;font-size:13px">
        Search an invoice to start a return.
      </div>

      <div style="min-height:0;flex:1;overflow:auto">
        <table style="width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed">
          <thead style="position:sticky;top:0;background:#2563eb;color:#fff;z-index:1">
            <tr>
              <th style="padding:9px;text-align:left;width:28%">Product</th>
              <th style="padding:9px;text-align:right;width:10%">Sold</th>
              <th style="padding:9px;text-align:right;width:12%">Returned</th>
              <th style="padding:9px;text-align:right;width:12%">Returnable</th>
              <th style="padding:9px;text-align:right;width:14%">Unit Refund</th>
              <th style="padding:9px;text-align:center;width:12%">Return Qty</th>
              <th style="padding:9px;text-align:right;width:12%">Refund</th>
            </tr>
          </thead>
          <tbody id="returnItemsBody">
            <tr>
              <td colspan="7" style="padding:28px;text-align:center;color:#71717a">No invoice loaded.</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div style="border-top:1px solid #e5e7eb;padding:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
        <label style="display:flex;flex-direction:column;gap:5px">
          <span style="font-size:12px;font-weight:700;color:#52525b">Refund method</span>
          <select id="returnRefundMethod" style="height:38px;border:1px solid #d4d4d8;border-radius:6px;padding:0 10px;font-size:13px">
            <option value="Cash">Cash</option>
            <option value="Card">Card</option>
            <option value="Bank">Bank</option>
            <option value="Customer Credit">Customer Credit</option>
          </select>
        </label>
        <div style="display:flex;align-items:end;justify-content:flex-end">
          <strong id="returnTotalRefund" style="font-size:20px;color:#0f766e">Rs. 0.00</strong>
        </div>
        <label style="display:flex;flex-direction:column;gap:5px">
          <span style="font-size:12px;font-weight:700;color:#52525b">Reason required</span>
          <input id="returnReason" placeholder="Damaged, wrong item, customer request"
            style="height:38px;border:1px solid #d4d4d8;border-radius:6px;padding:0 10px;font-size:13px" />
        </label>
        <label style="display:flex;flex-direction:column;gap:5px">
          <span style="font-size:12px;font-weight:700;color:#52525b">Notes optional</span>
          <input id="returnNotes" placeholder="Internal notes"
            style="height:38px;border:1px solid #d4d4d8;border-radius:6px;padding:0 10px;font-size:13px" />
        </label>
        <div style="grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">
          <button id="returnExchangeButton" type="button" class="epos-btn epos-btn-outline" disabled aria-disabled="true" title="Exchange is unavailable until implemented and certified.">Exchange Unavailable</button>
          <button id="returnFullButton" type="button" class="epos-btn epos-btn-outline">Full Return</button>
          <button id="processReturnButton" type="button" class="epos-btn epos-btn-primary" disabled aria-disabled="true" title="Process Return is disabled until certified against Document 43.">Process Return Disabled</button>
        </div>
      </div>
    </div>

    <aside style="min-height:0;border:1px solid #e5e7eb;background:#fff;border-radius:8px;display:flex;flex-direction:column;overflow:hidden">
      <div style="padding:12px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center">
        <strong style="font-size:14px">Recent Returns</strong>
        <span id="returnsListSummary" style="font-size:12px;color:#71717a">Not loaded</span>
      </div>
      <div id="returnsList" style="min-height:0;flex:1;overflow:auto;font-size:13px"></div>
    </aside>
  </section>
</div>
