<div class="grid gap-5 lg:grid-cols-[1.1fr_0.9fr]">
          <div class="rounded-lg border border-zinc-200 bg-white p-5">
            <p class="text-sm font-semibold uppercase tracking-[0.18em] text-teal-700">Returns</p>
            <h2 class="mt-2 text-2xl font-semibold text-zinc-950">Invoice Lookup & Refund</h2>
            <p id="returnsMessage" class="mt-3 hidden rounded-md px-3 py-2 text-sm"></p>
            <div class="mt-4 grid gap-3 md:grid-cols-[1fr_1fr_1fr_auto]">
              <input id="returnInvoiceSearch" class="rounded-md border border-zinc-300 px-3 py-2 text-sm" placeholder="Invoice number" />
              <input id="returnBarcodeSearch" class="rounded-md border border-zinc-300 px-3 py-2 text-sm" placeholder="Product barcode" />
              <input id="returnCustomerSearch" class="rounded-md border border-zinc-300 px-3 py-2 text-sm" placeholder="Customer name/phone" />
              <button id="lookupReturnButton" type="button" class="epos-btn epos-btn-primary">Lookup</button>
            </div>
            <div id="returnInvoicePanel" class="mt-4 rounded-lg border border-zinc-200 bg-zinc-50 p-4 text-sm">Search an invoice to start a return.</div>
            <div class="mt-4 overflow-hidden rounded-lg border border-zinc-200">
              <table class="min-w-full divide-y divide-zinc-200 text-sm">
                <thead class="bg-zinc-50 text-left text-xs font-semibold uppercase tracking-wide text-zinc-500">
                  <tr><th class="px-3 py-2">Product</th><th class="px-3 py-2">Sold</th><th class="px-3 py-2">Returned</th><th class="px-3 py-2">Return Qty</th><th class="px-3 py-2">Refund</th></tr>
                </thead>
                <tbody id="returnItemsBody" class="divide-y divide-zinc-100"></tbody>
              </table>
            </div>
            <div class="mt-4 grid gap-3 md:grid-cols-[1fr_2fr_auto]">
              <select id="returnRefundMethod" class="rounded-md border border-zinc-300 px-3 py-2 text-sm"><option>Cash Refund</option><option>Customer Credit</option></select>
              <input id="returnReason" class="rounded-md border border-zinc-300 px-3 py-2 text-sm" placeholder="Return reason" />
              <button id="processReturnButton" type="button" class="epos-btn epos-btn-primary">Process Return</button>
            </div>
          </div>
          <div class="rounded-lg border border-zinc-200 bg-white p-5">
            <h3 class="font-semibold text-zinc-950">Recent Returns</h3>
            <div id="returnsList" class="mt-3 max-h-[640px] divide-y divide-zinc-100 overflow-y-auto text-sm"></div>
          </div>
        </div>
