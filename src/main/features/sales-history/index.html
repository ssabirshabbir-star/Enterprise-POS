<div style="height:100%;padding:18px;display:flex;flex-direction:column;gap:12px;overflow:hidden">
  <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap">
    <div>
      <p style="margin:0;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#0f766e">Sales History</p>
      <h2 style="margin:4px 0 0;font-size:24px;font-weight:800;color:#18181b">Completed Invoices</h2>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <button id="salesHistoryReloadButton" type="button" class="epos-btn epos-btn-primary">Load Invoices</button>
      <button id="salesHistoryResetButton" type="button" class="epos-btn epos-btn-outline">Reset</button>
    </div>
  </div>

  <section style="border:1px solid #e5e7eb;background:#fff;border-radius:8px;padding:12px;display:flex;gap:10px;align-items:end;flex-wrap:wrap">
    <label style="display:flex;flex-direction:column;gap:5px;min-width:240px;flex:1">
      <span style="font-size:12px;font-weight:700;color:#52525b">Search invoice or customer</span>
      <input id="salesHistorySearch" type="search" placeholder="Invoice number, customer name, phone"
        style="height:38px;border:1px solid #d4d4d8;border-radius:6px;padding:0 10px;font-size:13px" />
    </label>
    <label style="display:flex;flex-direction:column;gap:5px">
      <span style="font-size:12px;font-weight:700;color:#52525b">From</span>
      <input id="salesHistoryFromDate" type="date"
        style="height:38px;border:1px solid #d4d4d8;border-radius:6px;padding:0 10px;font-size:13px" />
    </label>
    <label style="display:flex;flex-direction:column;gap:5px">
      <span style="font-size:12px;font-weight:700;color:#52525b">To</span>
      <input id="salesHistoryToDate" type="date"
        style="height:38px;border:1px solid #d4d4d8;border-radius:6px;padding:0 10px;font-size:13px" />
    </label>
    <label style="display:flex;flex-direction:column;gap:5px">
      <span style="font-size:12px;font-weight:700;color:#52525b">Status</span>
      <select id="salesHistoryStatus"
        style="height:38px;border:1px solid #d4d4d8;border-radius:6px;padding:0 10px;font-size:13px;min-width:140px">
        <option value="">All Status</option>
        <option value="COMPLETED">Completed</option>
        <option value="VOID">Void</option>
        <option value="REFUNDED">Refunded</option>
      </select>
    </label>
    <label style="display:flex;flex-direction:column;gap:5px">
      <span style="font-size:12px;font-weight:700;color:#52525b">Payment</span>
      <select id="salesHistoryPaymentMethod"
        style="height:38px;border:1px solid #d4d4d8;border-radius:6px;padding:0 10px;font-size:13px;min-width:140px">
        <option value="">All Methods</option>
        <option value="Cash">Cash</option>
        <option value="Card">Card</option>
        <option value="Bank">Bank</option>
        <option value="Credit">Credit</option>
        <option value="Mixed">Mixed</option>
      </select>
    </label>
  </section>

  <p id="salesHistoryMessage" class="hidden" style="margin:0;border-radius:6px;padding:8px 12px;font-size:13px;font-weight:700"></p>

  <section style="min-height:0;flex:1;border:1px solid #e5e7eb;background:#fff;border-radius:8px;overflow:hidden;display:flex;flex-direction:column">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #e5e7eb">
      <strong style="font-size:14px">Invoice List</strong>
      <span id="salesHistoryResultSummary" style="font-size:12px;color:#71717a">No invoices loaded</span>
    </div>
    <div style="min-height:0;flex:1;overflow:auto">
      <table style="width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed">
        <thead style="position:sticky;top:0;background:#2563eb;color:#fff;z-index:1">
          <tr>
            <th style="padding:9px;text-align:left;width:18%">Invoice</th>
            <th style="padding:9px;text-align:left;width:15%">Date</th>
            <th style="padding:9px;text-align:left;width:18%">Customer</th>
            <th style="padding:9px;text-align:left;width:10%">Payment</th>
            <th style="padding:9px;text-align:right;width:12%">Total</th>
            <th style="padding:9px;text-align:center;width:10%">Status</th>
            <th style="padding:9px;text-align:center;width:17%">Action</th>
          </tr>
        </thead>
        <tbody id="salesHistoryList">
          <tr>
            <td colspan="7" style="padding:28px;text-align:center;color:#71717a">Load invoices to begin.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <section id="salesHistoryDetailsPanel" class="hidden"
    style="position:fixed;inset:0;z-index:60;background:rgba(24,24,27,.45);align-items:center;justify-content:center;padding:24px">
    <div style="width:min(980px,96vw);max-height:88vh;background:#fff;border-radius:8px;box-shadow:0 20px 60px rgba(15,23,42,.25);display:flex;flex-direction:column;overflow:hidden">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #e5e7eb">
        <div>
          <h3 id="salesHistoryDetailsTitle" style="margin:0;font-size:18px;font-weight:800">Invoice Details</h3>
          <p id="salesHistoryDetailsMeta" style="margin:3px 0 0;font-size:12px;color:#71717a"></p>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <button id="salesHistoryDetailsPrintButton" type="button" class="epos-btn epos-btn-primary">Reprint</button>
          <button id="salesHistoryDetailsCloseButton" type="button" class="epos-btn epos-btn-outline">Close</button>
        </div>
      </div>
      <div id="salesHistoryDetailsBody" style="padding:16px;overflow:auto"></div>
    </div>
  </section>
</div>
