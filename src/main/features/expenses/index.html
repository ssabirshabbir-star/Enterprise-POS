<div class="grid gap-4 lg:grid-cols-[0.8fr_1.2fr]">
          <div class="rounded-lg border border-zinc-200 bg-white p-4">
            <p class="text-sm font-semibold uppercase tracking-[0.18em] text-teal-700">Expenses</p>
            <h2 class="mt-1 text-xl font-semibold text-zinc-950">Expense Entry</h2>
            <form id="expenseForm" class="mt-3 grid gap-3">
              <input id="expenseId" type="hidden" />
              <select id="expenseCategory" class="rounded-md border border-zinc-300 px-3 py-2 text-sm" required></select>
              <div class="grid gap-3 sm:grid-cols-2">
                <input id="expenseTitle" class="rounded-md border border-zinc-300 px-3 py-2 text-sm" placeholder="Expense title" required />
                <input id="expenseAmount" type="number" min="0.01" step="0.01" class="rounded-md border border-zinc-300 px-3 py-2 text-sm" placeholder="Amount" required />
                <select id="expensePaymentMethod" class="rounded-md border border-zinc-300 px-3 py-2 text-sm"><option>Cash</option><option>Card</option><option>Bank</option><option>Wallet</option></select>
                <input id="expenseDate" type="date" class="rounded-md border border-zinc-300 px-3 py-2 text-sm" required />
              </div>
              <input id="expenseReceiptPath" class="rounded-md border border-zinc-300 px-3 py-2 text-sm" placeholder="Receipt/image path foundation" />
              <input id="expenseNotes" class="rounded-md border border-zinc-300 px-3 py-2 text-sm" placeholder="Notes" />
              <div class="flex gap-2">
                <button id="saveExpenseButton" type="submit" class="epos-btn epos-btn-primary">Save Expense</button>
                <button id="resetExpenseButton" type="button" class="epos-btn epos-btn-outline">Reset</button>
              </div>
            </form>
            <form id="expenseCategoryForm" class="mt-4 grid grid-cols-[1fr_auto] gap-2 border-t border-zinc-200 pt-4">
              <input name="name" class="rounded-md border border-zinc-300 px-3 py-2 text-sm" placeholder="Custom category" />
              <button type="submit" class="epos-btn epos-btn-outline">Add</button>
            </form>
            <p id="expenseMessage" class="mt-3 hidden rounded-md px-3 py-2 text-sm"></p>
          </div>
          <div class="rounded-lg border border-zinc-200 bg-white p-4">
            <div class="flex flex-col gap-3 xl:flex-row xl:items-end xl:justify-between">
              <div>
                <h2 class="text-xl font-semibold text-zinc-950">Expense List</h2>
                <p class="text-sm text-zinc-500">Total: <strong id="expenseTotal">0.00</strong></p>
              </div>
              <div class="grid gap-2 sm:grid-cols-4">
                <input id="expenseFromDate" type="date" class="rounded-md border border-zinc-300 px-3 py-2 text-sm" />
                <input id="expenseToDate" type="date" class="rounded-md border border-zinc-300 px-3 py-2 text-sm" />
                <select id="expenseCategoryFilter" class="rounded-md border border-zinc-300 px-3 py-2 text-sm"></select>
                <select id="expensePaymentFilter" class="rounded-md border border-zinc-300 px-3 py-2 text-sm"><option value="">All payments</option><option>Cash</option><option>Card</option><option>Bank</option><option>Wallet</option></select>
              </div>
            </div>
            <div class="mt-3 overflow-hidden rounded-lg border border-zinc-200">
              <div class="max-h-[560px] overflow-auto">
                <table class="min-w-full divide-y divide-zinc-200 text-sm">
                  <thead class="bg-zinc-50 text-left text-xs font-semibold uppercase tracking-wide text-zinc-500">
                    <tr><th class="px-3 py-2">Date</th><th class="px-3 py-2">Category</th><th class="px-3 py-2">Title</th><th class="px-3 py-2">Amount</th><th class="px-3 py-2">Payment</th><th class="px-3 py-2">Actions</th></tr>
                  </thead>
                  <tbody id="expenseTableBody" class="divide-y divide-zinc-100"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
