<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grocery POS Login</title>
    <link rel="stylesheet" href="../../../renderer/styles/output.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="login-screen">
      <div class="login-stage" id="loginStage">
        <input id="username" class="overlay-field username-field" type="text" placeholder="Username" autocomplete="username" />

        <input id="password" class="overlay-field password-field" type="password" placeholder="Password" autocomplete="current-password" />

        <button id="eyeToggle" class="hotspot eye-hotspot" type="button" title="Show password"></button>

        <label class="hotspot remember-hotspot">
          <input id="rememberCheck" type="checkbox" />
        </label>

        <button id="forgotPassword" class="hotspot forgot-hotspot" type="button"></button>

        <button id="loginBtn" class="hotspot login-hotspot" type="button"></button>

        <button id="staffLogin" class="hotspot staff-hotspot" type="button"></button>

        <button id="biometricLogin" class="hotspot biometric-hotspot" type="button"></button>

        <button id="qrLogin" class="hotspot qr-hotspot" type="button"></button>
      </div>
    </div>

    <script src="./renderer.js"></script>
  </body>
</html>
