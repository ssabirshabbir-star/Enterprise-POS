<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enterprise POS</title>
    <link rel="stylesheet" href="./styles/output.css" />
  </head>
  <body class="min-h-screen bg-stone-100 text-zinc-950">
                    <main id="loginScreen" class="login-screen hidden" aria-label="Grocery POS login">
      <div class="login-stage" id="loginStage">
        <input id="username" name="username" class="overlay-field username-field" type="text" placeholder="Username" autocomplete="username" />

        <input id="password" name="password" class="overlay-field password-field" type="password" placeholder="Password" autocomplete="current-password" />

        <button id="toggleLoginPassword" class="hotspot eye-hotspot" type="button" title="Show password"></button>

        <label class="hotspot remember-hotspot">
          <input id="rememberMe" type="checkbox" />
        </label>

        <button id="forgotPasswordButton" class="hotspot forgot-hotspot" type="button"></button>

        <p id="message" class="login-message hidden"></p>

        <button id="loginButton" class="hotspot login-hotspot" type="button">
          <span data-login-button-label class="sr-only">Login</span>
        </button>

        <button class="hotspot staff-hotspot" type="button" data-login-option="Staff Login"></button>

        <button class="hotspot biometric-hotspot" type="button" data-login-option="Biometric"></button>

        <button class="hotspot qr-hotspot" type="button" data-login-option="QR Login"></button>
      </div>
    </main>
<section id="loadingScreen" class="flex min-h-screen items-center justify-center bg-stone-100">
      <div class="rounded-lg border border-zinc-200 bg-white px-6 py-5 text-sm font-medium text-zinc-700 shadow-sm">
        Checking secure session...
      </div>
    </section>

    <section id="dashboard" class="hidden min-h-screen bg-stone-100">
      <div class="flex min-h-screen">
        <aside class="epos-sidebar epos-app-sidebar hidden shrink-0 lg:flex">
          <div class="epos-sidebar-window" aria-hidden="true">
            <span class="epos-sidebar-dot epos-sidebar-dot-red"></span>
            <span class="epos-sidebar-dot epos-sidebar-dot-yellow"></span>
            <span class="epos-sidebar-dot epos-sidebar-dot-green"></span>
          </div>
          <div class="epos-sidebar-brand px-1">
            <span class="epos-sidebar-logo-mark">🛒</span>
            <div>
              <p class="text-xs font-semibold uppercase tracking-[0.22em] text-teal-300">Grocery</p>
              <h1 class="mt-2 text-xl font-semibold">POS</h1>
            </div>
          </div>
          <nav class="epos-sidebar-nav" id="sidebarNav">
            <button type="button" data-route="/dashboard" data-module="dashboard" class="navLink epos-sidebar-item"><span class="epos-sidebar-icon">&#8962;</span><span class="epos-sidebar-label">Dashboard</span></button>
            <button type="button" data-route="/pos" data-module="pos" class="navLink epos-sidebar-item"><span class="epos-sidebar-icon">&#128179;</span><span class="epos-sidebar-label">Sales</span></button>
            <button type="button" data-route="/products" data-module="products" class="navLink epos-sidebar-item"><span class="epos-sidebar-icon">&#128230;</span><span class="epos-sidebar-label">Products</span></button>
            <button type="button" data-route="/inventory" data-module="inventory" class="navLink epos-sidebar-item"><span class="epos-sidebar-icon">&#128202;</span><span class="epos-sidebar-label">Inventory</span></button>
            <button type="button" data-route="/purchases" data-module="purchases" class="navLink epos-sidebar-item"><span class="epos-sidebar-icon">&#128722;</span><span class="epos-sidebar-label">Purchases</span></button>
            <button type="button" data-route="/purchase-orders" data-module="purchase_orders" class="navLink epos-sidebar-item"><span class="epos-sidebar-icon">&#128196;</span><span class="epos-sidebar-label">Purchase Orders</span></button>
            <button type="button" data-route="/customers" data-module="customers" class="navLink epos-sidebar-item"><span class="epos-sidebar-icon">&#128100;</span><span class="epos-sidebar-label">Customers</span></button>
            <button type="button" data-route="/returns" data-module="returns" class="navLink epos-sidebar-item"><span class="epos-sidebar-icon">&#8634;</span><span class="epos-sidebar-label">Returns</span></button>
            <button type="button" data-route="/reports" data-module="reports" class="navLink epos-sidebar-item"><span class="epos-sidebar-icon">&#128200;</span><span class="epos-sidebar-label">Reports</span></button>
            <button type="button" data-route="/lucky-draw" data-module="lucky_draw" class="navLink epos-sidebar-item"><span class="epos-sidebar-icon">&#127873;</span><span class="epos-sidebar-label">Lucky Draw</span></button>
            <button type="button" data-route="/settings" data-module="settings" class="navLink epos-sidebar-item"><span class="epos-sidebar-icon">&#9881;</span><span class="epos-sidebar-label">Settings</span></button>
            <button type="button" data-route="/sync" data-module="sync" class="navLink epos-sidebar-item"><span class="epos-sidebar-icon">&#8644;</span><span class="epos-sidebar-label">Sync Queue</span></button>
            <button type="button" data-route="/suppliers" data-module="suppliers" class="navLink epos-sidebar-item"><span class="epos-sidebar-icon">&#128666;</span><span class="epos-sidebar-label">Suppliers</span></button>
            <button type="button" data-route="/expenses" data-module="expenses" class="navLink epos-sidebar-item"><span class="epos-sidebar-icon">&#128176;</span><span class="epos-sidebar-label">Expenses</span></button>
            <button type="button" data-route="/users" data-module="users" class="navLink epos-sidebar-item"><span class="epos-sidebar-icon">&#128101;</span><span class="epos-sidebar-label">User Management</span></button>
          </nav>
          <div class="epos-sidebar-user-card">
            <span class="epos-sidebar-user-avatar">👤</span>
            <div>
              <strong>Admin User</strong>
              <small>admin@grocerypos.com</small>
            </div>
          </div>
        </aside>

        <div class="min-w-0 flex-1">
      <header class="border-b border-zinc-200 bg-white px-8 py-5">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-sm font-semibold uppercase tracking-[0.18em] text-teal-700">Enterprise POS</p>
            <h1 id="routeTitle" class="mt-1 text-2xl font-semibold text-zinc-950">Dashboard</h1>
          </div>
          <div class="flex items-center gap-3">
            <button
              id="syncStatusIndicator"
              type="button"
              data-route="/sync"
              class="navLink rounded-md border border-emerald-200 bg-emerald-50 px-3 py-2 text-xs font-semibold text-emerald-700"
            >
              Online
            </button>
            <div class="rounded-md bg-zinc-100 px-4 py-2 text-sm font-medium text-zinc-700" id="signedInUser"></div>
            <button
              id="logoutButton"
              type="button"
              class="epos-btn epos-btn-sm epos-btn-outline"
            >
              Logout
            </button>
          </div>
        </div>
      </header>

      <main class="px-8 py-8">
            <section id="dashboardRoute" data-route-panel="/dashboard" data-fragment="../main/features/dashboard/index.html"></section>
      <section id="posModule" data-route-panel="/pos" data-fragment="../main/features/sales/index.html" class="hidden"></section>
      <section id="productModule" data-route-panel="/products" data-fragment="../main/features/products/index.html" class="hidden w-full"></section>
      <section id="inventoryModule" data-route-panel="/inventory" data-fragment="../main/features/inventory/index.html" class="mx-auto hidden max-w-7xl"></section>
      <section id="purchaseModule" data-route-panel="/purchases" data-fragment="../main/features/purchases/index.html" class="mx-auto hidden max-w-7xl"></section>
      <section id="purchaseOrdersModule" data-route-panel="/purchase-orders" data-fragment="../main/features/purchase-orders/index.html" class="mx-auto hidden max-w-7xl"></section>
      <section id="reportsModule" data-route-panel="/reports" data-fragment="../main/features/reports/index.html" class="mx-auto hidden max-w-7xl"></section>
      <section id="luckyDrawModule" data-route-panel="/lucky-draw" data-fragment="../main/features/lucky-draw/index.html" class="w-full hidden"></section>
      <section id="suppliersModule" data-route-panel="/suppliers" data-fragment="../main/features/suppliers/index.html" class="mx-auto hidden max-w-7xl"></section>
      <section id="expensesModule" data-route-panel="/expenses" data-fragment="../main/features/expenses/index.html" class="mx-auto hidden max-w-7xl"></section>
      <section id="customersModule" data-route-panel="/customers" data-fragment="../main/features/customers/index.html" class="mx-auto hidden max-w-7xl"></section>
      <section id="returnsModule" data-route-panel="/returns" data-fragment="../main/features/returns/index.html" class="mx-auto hidden max-w-7xl"></section>
      <section id="syncModule" data-route-panel="/sync" data-fragment="../main/features/sync/index.html" class="mx-auto hidden max-w-7xl"></section>
      <section id="usersModule" data-route-panel="/users" data-fragment="../main/features/access-control/index.html" class="mx-auto hidden max-w-7xl"></section>
      <section id="settingsModule" data-route-panel="/settings" data-fragment="../main/features/settings/index.html" class="mx-auto hidden max-w-7xl"></section>

<section id="productFormPanel" class="fixed inset-0 z-20 hidden bg-zinc-950/35 px-4 py-6">
      <div class="mx-auto flex max-h-full max-w-5xl flex-col overflow-hidden rounded-lg bg-white shadow-xl">
        <div class="flex items-center justify-between border-b border-zinc-200 px-5 py-4">
          <div>
            <p class="text-sm font-semibold uppercase tracking-[0.16em] text-teal-700">Product</p>
            <h2 id="productFormTitle" class="text-xl font-semibold text-zinc-950">Add Product</h2>
          </div>
          <button id="closeProductFormButton" type="button" class="epos-btn epos-btn-sm epos-btn-outline">Close</button>
        </div>

        <div class="overflow-y-auto px-5 py-5">
          <form id="productForm" class="grid gap-4 md:grid-cols-3">
            <input type="hidden" id="productId" />
            <label class="md:col-span-2">
              <span class="text-sm font-medium text-zinc-800">Product name</span>
              <input id="productName" required class="mt-2 w-full rounded-md border border-zinc-300 px-3 py-2 outline-none focus:border-teal-600 focus:ring-4 focus:ring-teal-100" />
            </label>
            <label>
              <span class="text-sm font-medium text-zinc-800">SKU</span>
              <input id="productSku" class="mt-2 w-full rounded-md border border-zinc-300 px-3 py-2 uppercase outline-none focus:border-teal-600 focus:ring-4 focus:ring-teal-100" placeholder="Auto if blank" />
            </label>
            <label>
              <span class="text-sm font-medium text-zinc-800">Barcode</span>
              <input id="productBarcode" class="mt-2 w-full rounded-md border border-zinc-300 px-3 py-2 outline-none focus:border-teal-600 focus:ring-4 focus:ring-teal-100" placeholder="Scan or auto" />
            </label>
            <label>
              <span class="text-sm font-medium text-zinc-800">Category</span>
              <select id="productCategory" class="mt-2 w-full rounded-md border border-zinc-300 px-3 py-2 outline-none focus:border-teal-600 focus:ring-4 focus:ring-teal-100"></select>
            </label>
            <label>
              <span class="text-sm font-medium text-zinc-800">Brand</span>
              <select id="productBrand" class="mt-2 w-full rounded-md border border-zinc-300 px-3 py-2 outline-none focus:border-teal-600 focus:ring-4 focus:ring-teal-100"></select>
            </label>
            <label>
              <span class="text-sm font-medium text-zinc-800">Unit</span>
              <select id="productUnit" class="mt-2 w-full rounded-md border border-zinc-300 px-3 py-2 outline-none focus:border-teal-600 focus:ring-4 focus:ring-teal-100"></select>
            </label>
            <label>
              <span class="text-sm font-medium text-zinc-800">Purchase price</span>
              <input id="purchasePrice" type="number" min="0" step="0.01" value="0" required class="mt-2 w-full rounded-md border border-zinc-300 px-3 py-2 outline-none focus:border-teal-600 focus:ring-4 focus:ring-teal-100" />
            </label>
            <label>
              <span class="text-sm font-medium text-zinc-800">Sale price</span>
              <input id="salePrice" type="number" min="0" step="0.01" value="0" required class="mt-2 w-full rounded-md border border-zinc-300 px-3 py-2 outline-none focus:border-teal-600 focus:ring-4 focus:ring-teal-100" />
            </label>
            <label>
              <span class="text-sm font-medium text-zinc-800">Wholesale price</span>
              <input id="wholesalePrice" type="number" min="0" step="0.01" value="0" class="mt-2 w-full rounded-md border border-zinc-300 px-3 py-2 outline-none focus:border-teal-600 focus:ring-4 focus:ring-teal-100" />
            </label>
            <label>
              <span class="text-sm font-medium text-zinc-800">Minimum stock</span>
              <input id="minStockLevel" type="number" min="0" step="0.001" value="0" class="mt-2 w-full rounded-md border border-zinc-300 px-3 py-2 outline-none focus:border-teal-600 focus:ring-4 focus:ring-teal-100" />
            </label>
            <label>
              <span class="text-sm font-medium text-zinc-800">Current stock</span>
              <input id="currentStock" type="number" min="0" step="0.001" value="0" class="mt-2 w-full rounded-md border border-zinc-300 px-3 py-2 outline-none focus:border-teal-600 focus:ring-4 focus:ring-teal-100" />
            </label>
            <label class="flex items-end gap-3 pb-2">
              <input id="productActive" type="checkbox" checked class="h-5 w-5 rounded border-zinc-300 text-teal-700 focus:ring-teal-600" />
              <span class="text-sm font-medium text-zinc-800">Active</span>
            </label>
            <div class="md:col-span-3 flex flex-col gap-3 border-t border-zinc-200 pt-4 sm:flex-row sm:justify-end">
              <button id="barcodePrintButton" type="button" class="epos-btn epos-btn-outline">Print Barcode</button>
              <button id="saveProductButton" type="submit" class="epos-btn epos-btn-primary">Save Product</button>
            </div>
          </form>

          <div class="mt-6 grid gap-4 border-t border-zinc-200 pt-5 md:grid-cols-3">
            <form class="catalogForm rounded-lg border border-zinc-200 p-4" data-type="categories">
              <h3 class="font-semibold text-zinc-950">Category</h3>
              <input name="name" class="mt-3 w-full rounded-md border border-zinc-300 px-3 py-2 text-sm" placeholder="Category name" required />
              <input name="description" class="mt-2 w-full rounded-md border border-zinc-300 px-3 py-2 text-sm" placeholder="Description" />
              <button type="submit" class="epos-btn epos-btn-neutral mt-3">Add Category</button>
              <div id="categoryList" class="mt-4 space-y-2 text-sm"></div>
            </form>
            <form class="catalogForm rounded-lg border border-zinc-200 p-4" data-type="brands">
              <h3 class="font-semibold text-zinc-950">Brand</h3>
              <input name="name" class="mt-3 w-full rounded-md border border-zinc-300 px-3 py-2 text-sm" placeholder="Brand name" required />
              <input name="description" class="mt-2 w-full rounded-md border border-zinc-300 px-3 py-2 text-sm" placeholder="Description" />
              <button type="submit" class="epos-btn epos-btn-neutral mt-3">Add Brand</button>
              <div id="brandList" class="mt-4 space-y-2 text-sm"></div>
            </form>
            <form class="catalogForm rounded-lg border border-zinc-200 p-4" data-type="units">
              <h3 class="font-semibold text-zinc-950">Unit</h3>
              <input name="name" class="mt-3 w-full rounded-md border border-zinc-300 px-3 py-2 text-sm" placeholder="Unit name" required />
              <input name="shortName" class="mt-2 w-full rounded-md border border-zinc-300 px-3 py-2 text-sm" placeholder="Short name" required />
              <button type="submit" class="epos-btn epos-btn-neutral mt-3">Add Unit</button>
              <div id="unitList" class="mt-4 space-y-2 text-sm"></div>
            </form>
          </div>
        </div>
      </div>
    </section>

    <script src="../main/features/dashboard/index.js"></script>
    <script src="../Components/Billing/billing.js"></script>
    <script src="./scripts/login.js"></script>
  </body>
</html>
