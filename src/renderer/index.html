<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enterprise POS</title>
    <link rel="stylesheet" href="./styles/output.css" />
  </head>
  <body class="min-h-screen bg-stone-100 text-zinc-950">
                    <main id="loginScreen" class="login-screen hidden" aria-label="Grocery POS login">
      <div class="login-stage" id="loginStage">
        <input id="username" name="username" class="overlay-field username-field" type="text" placeholder="Username" autocomplete="username" />

        <input id="password" name="password" class="overlay-field password-field" type="password" placeholder="Password" autocomplete="current-password" />

        <button id="toggleLoginPassword" class="hotspot eye-hotspot" type="button" disabled aria-disabled="true" title="Password visibility toggle is unavailable in this installer."></button>

        <label class="hotspot remember-hotspot" title="Remember me is unavailable in this installer.">
          <input id="rememberMe" type="checkbox" disabled aria-disabled="true" />
        </label>

        <button id="forgotPasswordButton" class="hotspot forgot-hotspot" type="button" disabled aria-disabled="true" title="Password recovery is unavailable in this installer."></button>

        <p id="message" class="login-message hidden"></p>

        <button id="loginButton" class="hotspot login-hotspot" type="button">
          <span data-login-button-label class="sr-only">Login</span>
        </button>

        <button class="hotspot staff-hotspot" type="button" data-login-option="Staff Login" disabled aria-disabled="true" title="Staff login shortcut is unavailable in this installer."></button>

        <button class="hotspot biometric-hotspot" type="button" data-login-option="Biometric" disabled aria-disabled="true" title="Biometric login is unavailable in this installer."></button>

        <button class="hotspot qr-hotspot" type="button" data-login-option="QR Login" disabled aria-disabled="true" title="QR login is unavailable in this installer."></button>
      </div>
    </main>
<section id="loadingScreen" class="flex min-h-screen items-center justify-center bg-stone-100">
      <div class="rounded-lg border border-zinc-200 bg-white px-6 py-5 text-sm font-medium text-zinc-700 shadow-sm">
        Checking secure session...
      </div>
    </section>

    <section id="dashboard" class="hidden min-h-screen bg-stone-100">
      <div class="flex min-h-screen">
        <aside class="epos-sidebar epos-app-sidebar hidden shrink-0 lg:flex">
          <div class="epos-sidebar-window" aria-hidden="true">
            <span class="epos-sidebar-dot epos-sidebar-dot-red"></span>
            <span class="epos-sidebar-dot epos-sidebar-dot-yellow"></span>
            <span class="epos-sidebar-dot epos-sidebar-dot-green"></span>
          </div>
          <div class="epos-sidebar-brand px-1">
            <span class="epos-sidebar-logo-mark">🛒</span>
            <div>
              <p class="text-xs font-semibold uppercase tracking-[0.22em] text-teal-300">Grocery</p>
              <h1 class="mt-2 text-xl font-semibold">POS</h1>
            </div>
          </div>
          <nav class="epos-sidebar-nav" id="sidebarNav">
            <button type="button" data-route="/dashboard" data-module="dashboard" class="navLink epos-sidebar-item"><span class="epos-sidebar-icon">&#8962;</span><span class="epos-sidebar-label">Dashboard</span></button>
            <button type="button" data-route="/pos" data-module="pos" class="navLink epos-sidebar-item"><span class="epos-sidebar-icon">&#128179;</span><span class="epos-sidebar-label">Billing</span></button>
            <button type="button" data-route="/sales-history" data-module="pos" class="navLink epos-sidebar-item"><span class="epos-sidebar-icon">&#128196;</span><span class="epos-sidebar-label">Completed Invoices</span></button>
            <button type="button" data-route="/products" data-module="products" class="navLink epos-sidebar-item"><span class="epos-sidebar-icon">&#128230;</span><span class="epos-sidebar-label">Products</span></button>
            <button type="button" data-route="/inventory" data-module="inventory" class="navLink epos-sidebar-item"><span class="epos-sidebar-icon">&#128202;</span><span class="epos-sidebar-label">Inventory</span></button>
            <button type="button" data-route="/purchases" data-module="purchases" class="navLink epos-sidebar-item"><span class="epos-sidebar-icon">&#128722;</span><span class="epos-sidebar-label">Purchases</span></button>
            <button type="button" data-route="/purchase-orders" data-module="purchase_orders" class="navLink epos-sidebar-item"><span class="epos-sidebar-icon">&#128196;</span><span class="epos-sidebar-label">Purchase Orders</span></button>
            <button type="button" data-route="/suppliers" data-module="suppliers" class="navLink epos-sidebar-item"><span class="epos-sidebar-icon">&#128666;</span><span class="epos-sidebar-label">Suppliers</span></button>
            <button type="button" data-route="/customers" data-module="customers" class="navLink epos-sidebar-item"><span class="epos-sidebar-icon">&#128100;</span><span class="epos-sidebar-label">Customers</span></button>
            <button type="button" data-route="/returns" data-module="returns" class="navLink epos-sidebar-item"><span class="epos-sidebar-icon">&#8634;</span><span class="epos-sidebar-label">Returns</span></button>
            <button type="button" data-route="/reports" data-module="reports" class="navLink epos-sidebar-item"><span class="epos-sidebar-icon">&#128200;</span><span class="epos-sidebar-label">Reports</span></button>
            <button type="button" data-route="/expenses" data-module="expenses" class="navLink epos-sidebar-item" hidden aria-hidden="true" title="Expenses are disabled until installer parity review is complete."><span class="epos-sidebar-icon">&#128176;</span><span class="epos-sidebar-label">Expenses</span></button>
            <button type="button" data-route="/lucky-draw" data-module="lucky_draw" class="navLink epos-sidebar-item" hidden aria-hidden="true" title="Lucky Draw is on HOLD until certification."><span class="epos-sidebar-icon">&#127873;</span><span class="epos-sidebar-label">Lucky Draw</span></button>
            <button type="button" data-route="/users" data-module="users" class="navLink epos-sidebar-item"><span class="epos-sidebar-icon">&#128101;</span><span class="epos-sidebar-label">User Management</span></button>
            <button type="button" data-route="/settings" data-module="settings" class="navLink epos-sidebar-item"><span class="epos-sidebar-icon">&#9881;</span><span class="epos-sidebar-label">Settings</span></button>
            <button type="button" data-route="/sync" data-module="sync" class="navLink epos-sidebar-item"><span class="epos-sidebar-icon">&#8644;</span><span class="epos-sidebar-label">Sync Queue</span></button>
          </nav>
          <div class="epos-sidebar-user-card">
            <span class="epos-sidebar-user-avatar">👤</span>
            <div>
              <strong>Admin User</strong>
              <small>admin@grocerypos.com</small>
            </div>
          </div>
        </aside>

        <div class="min-w-0 flex-1 flex flex-col overflow-hidden">
      <header class="border-b border-zinc-200 bg-white px-8 py-5">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-sm font-semibold uppercase tracking-[0.18em] text-teal-700">Enterprise POS</p>
            <h1 id="routeTitle" class="mt-1 text-2xl font-semibold text-zinc-950">Dashboard</h1>
          </div>
          <div class="flex items-center gap-3">
            <button
              id="syncStatusIndicator"
              type="button"
              data-route="/sync"
              class="navLink rounded-md border border-emerald-200 bg-emerald-50 px-3 py-2 text-xs font-semibold text-emerald-700"
              disabled
              aria-disabled="true"
              title="Sync is read-only until installer certification."
            >
              Online
            </button>
            <div class="rounded-md bg-zinc-100 px-4 py-2 text-sm font-medium text-zinc-700" id="signedInUser"></div>
            <button
              id="logoutButton"
              type="button"
              class="epos-btn epos-btn-sm epos-btn-outline"
            >
              Logout
            </button>
          </div>
        </div>
      </header>

      <main id="appMain" class="flex-1 min-h-0 overflow-hidden">
            <section id="dashboardRoute" data-route-panel="/dashboard" data-fragment="../main/features/dashboard/index.html" class="hidden dashboard-shell"></section>
      <section id="posModule" data-route-panel="/pos" data-fragment="../main/features/billing/index.html" class="hidden"></section>
      <section id="salesHistoryModule" data-route-panel="/sales-history" data-fragment="../main/features/sales-history/index.html" class="hidden h-full w-full"></section>
      <section id="productModule" data-route-panel="/products" data-fragment="../main/features/products/index.html" class="hidden w-full"></section>
      <section id="inventoryModule" data-route-panel="/inventory" data-fragment="../main/features/inventory/index.html" class="mx-auto hidden max-w-7xl"></section>
      <section id="purchaseModule" data-route-panel="/purchases" data-fragment="../main/features/purchases/index.html" class="mx-auto hidden max-w-7xl"></section>
      <section id="purchaseOrdersModule" data-route-panel="/purchase-orders" data-fragment="../main/features/purchase-orders/index.html" class="mx-auto hidden max-w-7xl"></section>
      <section id="reportsModule" data-route-panel="/reports" data-fragment="../main/features/reports/index.html" class="mx-auto hidden max-w-7xl"></section>
      <section id="luckyDrawModule" data-route-panel="/lucky-draw" data-fragment="../main/features/luckydraw_v2/ui/index.html" class="w-full h-full hidden" hidden aria-hidden="true"></section>
      <section id="suppliersModule" data-route-panel="/suppliers" data-fragment="../main/features/suppliers/index.html" class="mx-auto hidden max-w-7xl"></section>
      <section id="expensesModule" data-route-panel="/expenses" data-fragment="../main/features/expenses/index.html" class="mx-auto hidden max-w-7xl" hidden aria-hidden="true"></section>
      <section id="customersModule" data-route-panel="/customers" data-fragment="../main/features/customers/index.html" class="mx-auto hidden max-w-7xl"></section>
      <section id="returnsModule" data-route-panel="/returns" data-fragment="../main/features/returns/index.html" class="mx-auto hidden max-w-7xl"></section>
      <section id="syncModule" data-route-panel="/sync" data-fragment="../main/features/sync/index.html" class="mx-auto hidden max-w-7xl"></section>
      <section id="usersModule" data-route-panel="/users" data-fragment="../main/features/access-control/index.html" class="mx-auto hidden max-w-7xl"></section>
      <section id="settingsModule" data-route-panel="/settings" data-fragment="../main/features/settings/index.html" class="mx-auto hidden max-w-7xl"></section>

<section id="productFormPanel" class="fixed inset-0 z-20 hidden items-center justify-center bg-zinc-950/40" style="display:none;align-items:center;justify-content:center;">
      <div class="pf-modal">
        <!-- Header -->
        <div class="pf-header">
          <div class="pf-header-left">
            <span class="pf-badge">PRODUCT</span>
            <h2 id="productFormTitle" class="pf-title">Add Product</h2>
          </div>
          <button id="closeProductFormButton" type="button" class="pf-close-btn">✕ Close</button>
        </div>

        <!-- Main Product Form -->
        <form id="productForm" class="pf-body">
          <input type="hidden" id="productId" />

          <!-- Row 1: Name (spans 3) + SKU -->
          <div class="pf-field pf-span3">
            <label class="pf-label" for="productName">Product Name <span class="pf-required">*</span></label>
            <input id="productName" required class="pf-input" placeholder="Enter product name" />
          </div>
          <div class="pf-field">
            <label class="pf-label" for="productSku">SKU</label>
            <input id="productSku" class="pf-input pf-upper" placeholder="Auto if blank" />
          </div>

          <!-- Row 2: Barcode + Category + Brand + Unit -->
          <div class="pf-field">
            <label class="pf-label" for="productBarcode">Barcode</label>
            <input id="productBarcode" class="pf-input" placeholder="Scan or auto" />
          </div>
          <div class="pf-field">
            <label class="pf-label" for="productCategory">Category</label>
            <select id="productCategory" class="pf-input"></select>
          </div>
          <div class="pf-field">
            <label class="pf-label" for="productBrand">Brand</label>
            <select id="productBrand" class="pf-input"></select>
          </div>
          <div class="pf-field">
            <label class="pf-label" for="productUnit">Unit</label>
            <select id="productUnit" class="pf-input"></select>
          </div>

          <!-- Row 3: 3 Prices in a 3-col sub-row -->
          <div class="pf-row-3">
            <div class="pf-field">
              <label class="pf-label" for="purchasePrice">Cost Price <span class="pf-required">*</span></label>
              <input id="purchasePrice" type="number" min="0" step="0.01" value="0" required class="pf-input" />
            </div>
            <div class="pf-field">
              <label class="pf-label" for="salePrice">Sale Price <span class="pf-required">*</span></label>
              <input id="salePrice" type="number" min="0" step="0.01" value="0" required class="pf-input" />
            </div>
            <div class="pf-field">
              <label class="pf-label" for="wholesalePrice">Wholesale Price</label>
              <input id="wholesalePrice" type="number" min="0" step="0.01" value="0" class="pf-input" />
            </div>
          </div>

          <!-- Row 4: Stock fields + Active toggle in a 3-col sub-row -->
          <div class="pf-row-3">
            <div class="pf-field">
              <label class="pf-label" for="minStockLevel">Min Stock</label>
              <input id="minStockLevel" type="number" min="0" step="0.001" value="0" class="pf-input" />
            </div>
            <div class="pf-field">
              <label class="pf-label" for="currentStock">Current Stock</label>
              <input id="currentStock" type="number" min="0" step="0.001" value="0" class="pf-input" />
            </div>
            <div class="pf-field pf-active-row">
              <label class="pf-active-label">
                <input id="productActive" type="checkbox" checked class="pf-checkbox" />
                <span>Active Product</span>
              </label>
            </div>
          </div>

          <details id="productPolicySection" class="pf-policy-section">
            <summary class="pf-policy-summary">
              <span>Advanced Product Policies</span>
              <small>Optional controls for products that need stricter handling</small>
            </summary>
            <div class="pf-policy-grid">
              <div class="pf-field pf-active-row">
                <label class="pf-active-label">
                  <input id="allowSalePriceOverride" type="checkbox" class="pf-checkbox" />
                  <span>Allow Price Override</span>
                </label>
              </div>
              <div class="pf-field pf-active-row">
                <label class="pf-active-label">
                  <input id="autoUpdateSalePriceFromPurchase" type="checkbox" class="pf-checkbox" />
                  <span>Auto Update Sale Price</span>
                </label>
              </div>
              <div class="pf-field pf-active-row">
                <label class="pf-active-label">
                  <input id="trackExpiry" type="checkbox" class="pf-checkbox" />
                  <span>Track Expiry</span>
                </label>
              </div>
              <div class="pf-field pf-active-row">
                <label class="pf-active-label">
                  <input id="expiryRequired" type="checkbox" class="pf-checkbox" />
                  <span>Expiry Required</span>
                </label>
              </div>
              <div class="pf-field">
                <label class="pf-label" for="expiryAlertDays">Expiry Alert Days</label>
                <input id="expiryAlertDays" type="number" min="0" step="1" class="pf-input" placeholder="Optional" />
              </div>
            </div>
          </details>


          <!-- Footer actions -->
          <div class="pf-footer">
            <button id="pfCatalogToggle" type="button" class="pf-catalog-toggle-btn">⊕ Manage Categories / Brands / Units</button>
            <div class="pf-footer-actions">
              <button id="barcodePrintButton" type="button" class="pf-btn-secondary">⎙ Print Barcode</button>
              <button id="saveProductButton" type="submit" class="pf-btn-primary">✓ Save Product</button>
            </div>
          </div>
        </form>

        <!-- Collapsible Catalog Panel -->
        <div id="pfCatalogPanel" class="pf-catalog-panel hidden">
          <div class="pf-catalog-grid">
            <form class="catalogForm pf-catalog-form" data-type="categories">
              <h4 class="pf-catalog-title">📁 Category</h4>
              <input name="name" class="pf-input pf-sm" placeholder="Category name" required />
              <input name="description" class="pf-input pf-sm" placeholder="Description (optional)" />
              <button type="submit" class="pf-catalog-add-btn">+ Add Category</button>
              <div id="categoryList" class="pf-catalog-list"></div>
            </form>
            <form class="catalogForm pf-catalog-form" data-type="brands">
              <h4 class="pf-catalog-title">🏷️ Brand</h4>
              <input name="name" class="pf-input pf-sm" placeholder="Brand name" required />
              <input name="description" class="pf-input pf-sm" placeholder="Description (optional)" />
              <button type="submit" class="pf-catalog-add-btn">+ Add Brand</button>
              <div id="brandList" class="pf-catalog-list"></div>
            </form>
            <form class="catalogForm pf-catalog-form" data-type="units">
              <h4 class="pf-catalog-title">📐 Unit</h4>
              <input name="name" class="pf-input pf-sm" placeholder="Unit name" required />
              <input name="shortName" class="pf-input pf-sm" placeholder="Short name" required />
              <button type="submit" class="pf-catalog-add-btn">+ Add Unit</button>
              <div id="unitList" class="pf-catalog-list"></div>
            </form>
          </div>
        </div>
      </div>
    </section>

    <script src="../main/features/dashboard/index.js"></script>
    <script src="./components/ui-primitives.js"></script>
    <script src="./feature-gate.js"></script>
    <script src="../Components/Billing/billing.js"></script>
    <!-- Billing module renderer — load order: cart → api → renderer -->
    <script src="../main/features/billing/billing.cart.js"></script>
    <script src="../main/features/billing/billing.api.js"></script>
    <script src="../main/features/billing/billing.renderer.js"></script>
    <!-- Sales History module renderer -->
    <script src="../main/features/sales-history/sales-history.api.js"></script>
    <script src="../main/features/sales-history/sales-history.renderer.js"></script>
    <!-- Returns module renderer -->
    <script src="../main/features/returns/returns.api.js"></script>
    <script src="../main/features/returns/returns.renderer.js"></script>
    <!-- Products module renderer — load order: api → renderer -->
    <script src="../main/features/products/products.api.js"></script>
    <script src="../main/features/products/products.renderer.js"></script>
    <!-- Customers module renderer — load order: api → renderer -->
    <script src="../main/features/customers/customers.api.js"></script>
    <script src="../main/features/customers/customers.renderer.js"></script>
    <!-- Lucky Draw V2 module renderer — load order: api → renderer -->
    <script src="../main/features/luckydraw_v2/ipc/luckydraw.api.js"></script>
    <script src="../main/features/luckydraw_v2/ui/luckydraw.renderer.js"></script>
    <!-- Suppliers module renderer -->
    <script src="../main/features/suppliers/suppliers.api.js"></script>
    <script src="../main/features/suppliers/suppliers.renderer.js"></script>
    <!-- Inventory module renderer -->
    <script src="../main/features/inventory/inventory.api.js"></script>
    <script src="../main/features/inventory/inventory.renderer.js"></script>
    <!-- Purchases module renderer -->
    <script src="../main/features/purchases/purchases.api.js"></script>
    <script src="../main/features/purchases/purchases.renderer.js"></script>
    <!-- Purchase Orders module renderer -->
    <script src="../main/features/purchase-orders/purchase-orders.api.js"></script>
    <script src="../main/features/purchase-orders/purchase-orders.renderer.js"></script>
    <!-- Reports module renderer -->
    <script src="../main/features/reports/reports.api.js"></script>
    <script src="../main/features/reports/reports.renderer.js"></script>
    <!-- Expenses module renderer -->
    <script src="../main/features/expenses/expenses.api.js"></script>
    <script src="../main/features/expenses/expenses.renderer.js"></script>
    <!-- User Management module renderer -->
    <script src="../main/features/access-control/access-control.api.js"></script>
    <script src="../main/features/access-control/access-control.renderer.js"></script>
    <script src="./scripts/auth.api.js"></script>
    <script src="./scripts/login.js"></script>

    <!-- Global Toast Notification Container -->
    <div id="toastContainer" aria-live="polite" aria-atomic="false" style="position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;max-width:380px;pointer-events:none;"></div>
  </body>
</html>
