<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enterprise POS Buttons</title>
    <link rel="stylesheet" href="../../renderer/styles/output.css" />
  </head>
  <body class="bg-white p-5">
    <div class="flex flex-wrap items-center gap-2">
      <button class="epos-btn epos-btn-neutral">Neutral</button>
      <button class="epos-btn epos-btn-primary">Primary</button>
      <button class="epos-btn epos-btn-secondary">Secondary</button>
      <button class="epos-btn epos-btn-accent">Accent</button>
      <button class="epos-btn epos-btn-info">Info</button>
      <button class="epos-btn epos-btn-success">Success</button>
      <button class="epos-btn epos-btn-warning">Warning</button>
      <button class="epos-btn epos-btn-error">Error</button>
